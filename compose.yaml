
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rentaldesk
      POSTGRES_USER: rentaldesk
      POSTGRES_PASSWORD: rentaldesk_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentaldesk -d rentaldesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
